[build]
  command = "npm run build"
  # Vike emits prerendered pages + public assets to dist/client, not dist
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

# /admin is client-rendered (prerender:false) — boot it from the prerendered
# client-only shell at /admin/login. Non-forced 200: real files still win.
[[redirects]]
  from = "/admin/*"
  to = "/admin/login/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"